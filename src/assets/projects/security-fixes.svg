<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">VT Security Fixes visual</title>
  <desc id="desc">An illustrated patch review linking a CVE, a DEP-3 patch, and a package.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092626"/><stop offset="1" stop-color="#070c13"/></linearGradient>
    <linearGradient id="glow" x2="1"><stop stop-color="#27d6ba" stop-opacity=".25"/><stop offset="1" stop-color="#27d6ba" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4c9e99" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1000" height="620" fill="url(#bg)"/><rect width="1000" height="620" fill="url(#grid)"/>
  <circle cx="852" cy="106" r="230" fill="#2fcab4" opacity=".045"/>
  <rect x="77" y="62" width="846" height="496" rx="20" fill="#0a1118" stroke="#3c7774" stroke-opacity=".8" stroke-width="2"/>
  <path d="M77 126H923" stroke="#2c4647" stroke-width="2"/>
  <circle cx="110" cy="94" r="7" fill="#f07478"/><circle cx="133" cy="94" r="7" fill="#e8bb62"/><circle cx="156" cy="94" r="7" fill="#45d2a7"/>
  <text x="196" y="101" fill="#b6d7d4" font-size="19" font-family="monospace">security-fixes / review</text>
  <rect x="114" y="160" width="508" height="355" rx="12" fill="#0d1d22" stroke="#355452"/>
  <text x="143" y="199" fill="#69dfd1" font-size="17" font-weight="700" font-family="monospace">CVE-2025-11021.patch</text>
  <rect x="446" y="174" width="144" height="35" rx="17" fill="#123d3c" stroke="#2ca99c"/>
  <text x="469" y="198" fill="#a7f2e9" font-size="13" font-weight="700" font-family="monospace">DEP-3</text>
  <path d="M143 228H588" stroke="#305054"/>
  <text x="143" y="269" fill="#718b94" font-size="16" font-family="monospace">--- upstream</text>
  <text x="143" y="302" fill="#718b94" font-size="16" font-family="monospace">+++ package</text>
  <rect x="134" y="331" width="462" height="42" rx="6" fill="#492e35"/><text x="151" y="358" fill="#f2a1a9" font-size="17" font-family="monospace">− vulnerable path</text>
  <rect x="134" y="380" width="462" height="42" rx="6" fill="#173d37"/><text x="151" y="407" fill="#9af1cd" font-size="17" font-family="monospace">+ upstream fix</text>
  <path d="M143 450H466" stroke="#3f6d6a" stroke-width="8" stroke-linecap="round" opacity=".6"/><path d="M143 472H385" stroke="#3f6d6a" stroke-width="8" stroke-linecap="round" opacity=".36"/>
  <path d="M649 243H708" stroke="#5acdc1" stroke-width="3" stroke-dasharray="8 8"/><path d="m702 235 10 8-10 8" fill="none" stroke="#5acdc1" stroke-width="3"/>
  <rect x="716" y="189" width="169" height="109" rx="13" fill="#13282c" stroke="#408c85"/>
  <text x="743" y="231" fill="#80e8d9" font-size="14" font-family="monospace">SOURCE</text><text x="743" y="263" fill="#f1f6f4" font-size="22" font-weight="700" font-family="sans-serif">Upstream</text>
  <path d="M800 298V342" stroke="#5acdc1" stroke-width="3" stroke-dasharray="8 8"/><path d="m792 337 8 10 8-10" fill="none" stroke="#5acdc1" stroke-width="3"/>
  <rect x="716" y="352" width="169" height="109" rx="13" fill="#13282c" stroke="#408c85"/>
  <text x="743" y="393" fill="#80e8d9" font-size="14" font-family="monospace">TARGET</text><text x="743" y="425" fill="#f1f6f4" font-size="22" font-weight="700" font-family="sans-serif">Package</text>
  <rect x="88" y="532" width="824" height="10" fill="url(#glow)"/>
