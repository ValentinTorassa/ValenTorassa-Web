<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">VT Ragnaros visual</title>
  <desc id="desc">An illustration of the Linux control deck with LCD keys, rotary knobs, and a touch strip.</desc>
